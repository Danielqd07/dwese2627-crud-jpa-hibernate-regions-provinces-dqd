<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head :: head ('Ticket Logger - Provincias')"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<main class="form-page">

    <div class="form-card">

        <h1 th:text="${isEdit}
                ? #{msg.province-form.edit}
                : #{msg.province-form.add}">
        </h1>

        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>

        <form th:action="${isEdit}
                ? @{/provinces/update}
                : @{/provinces/insert}"
              th:object="${province}"
              method="post"
              class="mt-3">


            <!-- ID solamente al editar -->
            <div th:if="${isEdit}">
                <input type="hidden"
                       th:field="*{id}" />
            </div>


            <!-- Código -->
            <div class="mb-3">

                <label for="code"
                       class="form-label"
                       th:text="#{msg.province-form.code}">
                </label>

                <input type="text"
                       th:field="*{code}"
                       id="code"
                       class="form-control" />

                <div th:if="${#fields.hasErrors('code')}"
                     class="text-danger"
                     th:errors="*{code}">
                </div>

            </div>


            <!-- Nombre -->
            <div class="mb-3">

                <label for="name"
                       class="form-label"
                       th:text="#{msg.province-form.name}">
                </label>

                <input type="text"
                       th:field="*{name}"
                       id="name"
                       class="form-control" />

                <div th:if="${#fields.hasErrors('name')}"
                     class="text-danger"
                     th:errors="*{name}">
                </div>

            </div>


            <!-- Comunidad Autónoma -->
            <div class="mb-3">

                <label for="region"
                       class="form-label"
                       th:text="#{msg.province-form.region}">
                </label>

                <select id="region"
                        th:field="*{regionId}"
                        class="form-select">

                    <option value=""
                            th:text="#{msg.province-form.region.select}">
                    </option>

                    <option th:each="region : ${listRegions}"
                            th:value="${region.id}"
                            th:text="${region.name}">
                    </option>

                </select>

                <div th:if="${#fields.hasErrors('regionId')}"
                     class="text-danger"
                     th:errors="*{regionId}">
                </div>

            </div>


            <!-- Botones -->
            <button type="submit"
                    class="btn btn-primary"
                    th:text="${isEdit}
                            ? #{msg.province-form.update}
                            : #{msg.province-form.create}">
            </button>

            <a th:href="@{/provinces}"
               class="btn btn-secondary"
               th:text="#{msg.province-form.returnback}">
            </a>

        </form>

    </div>

</main>

<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
